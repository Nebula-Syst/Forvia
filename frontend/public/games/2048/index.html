<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>2048 — Forvia</title>

  <script>document.documentElement.lang = new URLSearchParams(location.search).get('lang') === 'es' ? 'es' : 'en';</script>
  <link href="style/main.css" rel="stylesheet" type="text/css">
  <link href="forvia.css" rel="stylesheet" type="text/css">

  <meta name="HandheldFriendly" content="True">
  <meta name="MobileOptimized" content="320">
  <meta name="viewport" content="width=device-width, target-densitydpi=160dpi, initial-scale=1.0, maximum-scale=1, user-scalable=no, minimal-ui, viewport-fit=cover">
</head>
<body>
  <div class="container">
    <div class="heading">
      <h1 class="title">2048</h1>
      <div class="scores-container">
        <div class="score-container">0</div>
        <div class="best-container">0</div>
      </div>
    </div>

    <div class="above-game">
      <p class="game-intro">Join the numbers and get to the <strong>2048 tile!</strong></p>
      <a class="restart-button">New Game</a>
    </div>

    <div class="game-container">
      <div class="game-message">
        <p></p>
        <div class="lower">
	        <a class="keep-playing-button">Keep going</a>
          <a class="retry-button">Try again</a>
        </div>
      </div>

      <div class="grid-container">
        <div class="grid-row">
          <div class="grid-cell"></div>
          <div class="grid-cell"></div>
          <div class="grid-cell"></div>
          <div class="grid-cell"></div>
        </div>
        <div class="grid-row">
          <div class="grid-cell"></div>
          <div class="grid-cell"></div>
          <div class="grid-cell"></div>
          <div class="grid-cell"></div>
        </div>
        <div class="grid-row">
          <div class="grid-cell"></div>
          <div class="grid-cell"></div>
          <div class="grid-cell"></div>
          <div class="grid-cell"></div>
        </div>
        <div class="grid-row">
          <div class="grid-cell"></div>
          <div class="grid-cell"></div>
          <div class="grid-cell"></div>
          <div class="grid-cell"></div>
        </div>
      </div>

      <div class="tile-container">

      </div>
    </div>

    <p class="game-explanation">
      <strong class="important">How to play:</strong> Swipe (or use your <strong>arrow keys</strong>) to move the tiles. When two tiles with the same number touch, they <strong>merge into one!</strong>
    </p>
  </div>

  <!-- Forvia addition, not upstream (see NOTICE.md): static-text translation for ?lang=es. -->
  <script>
    if (document.documentElement.lang === 'es') {
      document.querySelector('.game-intro').innerHTML = 'Une los números y llega a la <strong>ficha 2048</strong>';
      document.querySelector('.restart-button').textContent = 'Nueva partida';
      document.querySelector('.keep-playing-button').textContent = 'Seguir jugando';
      document.querySelector('.retry-button').textContent = 'Reintentar';
      document.querySelector('.game-explanation').innerHTML =
        '<strong class="important">Cómo jugar:</strong> Desliza (o usa las <strong>flechas</strong>) para mover las fichas. Cuando dos fichas con el mismo número se tocan, ¡se <strong>fusionan en una!</strong>';
    }
  </script>
  <script src="js/bind_polyfill.js"></script>
  <script src="js/classlist_polyfill.js"></script>
  <script src="js/animframe_polyfill.js"></script>
  <script src="js/keyboard_input_manager.js"></script>
  <script src="js/html_actuator.js"></script>
  <script src="js/grid.js"></script>
  <script src="js/tile.js"></script>
  <script src="js/local_storage_manager.js"></script>
  <script src="js/game_manager.js"></script>
  <script src="js/application.js"></script>
</body>
</html>
