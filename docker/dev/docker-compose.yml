# Local dev stack for Forvia: api + web (+ the one-time media download), built from this checkout.
#
# Needs forvia-core's dev stack running first (github.com/Nebula-Syst/forvia-core,
# docker/dev/run.sh there): it owns Postgres (`db`), `core-api`, the shared `forvia` network and
# the shared `forvia-data` volume. This stack joins them, so `db`/`core-api` resolve by name just
# as in a single compose file. Production brings everything up together from the forvia-prod repo.
#
#   docker/dev/run.sh            # checks core is up, builds, starts, follows logs
#
# Paths are relative to this file; .env (optional) lives at the repo root.
name: forvia-dev

services:
  # One-time: download the exercise images + GIFs into ./media (skipped if already there).
  # ~140 MB, from github.com/hasaneyldrm/exercises-dataset. That dataset is MIT for the
  # metadata and instruction text, but the images and GIFs are © Gym visual
  # (https://gymvisual.com/) and are used under the dataset's terms — Forvia neither
  # redistributes nor relicenses them. See NOTICE.md.
  media:
    image: alpine/git
    volumes:
      - ../../media/img:/out/img
      - ../../media/gif:/out/gif
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        if [ -z "$$(ls -A /out/img 2>/dev/null)" ]; then
          echo "↓ Downloading exercise media (~140 MB, one time)…"
          echo "  Source:  github.com/hasaneyldrm/exercises-dataset"
          echo "  Metadata and instruction text: MIT."
          echo "  Images and animations: © Gym visual — https://gymvisual.com/"
          echo "  They are used under that dataset's terms, not Forvia's AGPL, and are"
          echo "  downloaded from upstream — Forvia does not redistribute them."
          echo "  Terms: https://gymvisual.com/content/3-terms-and-conditions-of-use"
          echo "  Reusing this media yourself, commercially or not, needs your own licence"
          echo "  from Gym visual. Details in NOTICE.md."
          git clone --depth 1 https://github.com/hasaneyldrm/exercises-dataset /tmp/ds
          cp /tmp/ds/images/*.jpg /out/img/ && cp /tmp/ds/videos/*.gif /out/gif/
          echo "✓ Exercise media ready ($$(ls /out/img | wc -l) images)."
        else
          echo "✓ Exercise media already present — skipping download."
        fi
    restart: "no"

  # Nebula's own half: level/XP/prestige/streaks, anti-cheat, daily tasks, the social feed, and
  # the whole coach/box system — Forvia's own original work, its own license. Talks to core-api
  # over the internal API (shared INTERNAL_SECRET) instead of touching auth/sessions/user_state
  # directly. Shares core-api's own /data/uploads (avatars vs. social photos/box images/coach
  # documents land in the same per-account folder either way).
  api:
    image: forvia-api:dev
    build:
      context: ../..
      dockerfile: docker/prod/Dockerfile
      target: api
    restart: unless-stopped
    env_file:
      - path: ../../.env
        required: false
    environment:
      # The port the API listens on. web proxies to this same value, so the two
      # cannot drift — change it in .env and both follow.
      - PORT=${PORT:-3000}
      - DATA_DIR=/data
      - DATABASE_URL=postgres://${POSTGRES_USER:-forvia}:${POSTGRES_PASSWORD:-forvia}@db:5432/${POSTGRES_DB:-forvia}
      - CORE_URL=http://core-api:${CORE_PORT:-3000}
      - INTERNAL_SECRET=${INTERNAL_SECRET:-dev-only-insecure-secret-change-me}
    volumes:
      - forvia-data:/data    # shared with core-api (forvia-core repo)
    networks: [forvia]

  # Builds the React frontend (multi-stage) and serves it, proxying /api → api/core-api
  # and the exercise media from the shared volume. Single origin for passkeys.
  web:
    image: forvia-web:dev
    build:
      context: ../..
      dockerfile: docker/prod/Dockerfile
      target: web
    restart: unless-stopped
    depends_on:
      media:
        condition: service_completed_successfully
      api:
        condition: service_started
    ports:
      - "${WEB_PORT:-8080}:${NGINX_PORT:-80}"
    # nginx renders its config at start-up from these (web/nginx.conf.template),
    # so the API service does not have to be called `api`. Defaults are the old
    # hardcoded values, so an existing .env and an existing stack are unaffected.
    environment:
      - NGINX_PORT=${NGINX_PORT:-80}
      - BACKEND=${BACKEND:-api}
      - PORT=${PORT:-3000}
      - CORE_BACKEND=${CORE_BACKEND:-core-api}
      - CORE_PORT=${CORE_PORT:-3000}
    volumes:
      - ../../media/img:/usr/share/nginx/html/img:ro
      - ../../media/gif:/usr/share/nginx/html/gif:ro
    networks: [forvia]

# Both created by forvia-core's dev stack.
networks:
  forvia:
    name: forvia
    external: true

volumes:
  forvia-data:
    name: forvia-data
    external: true
