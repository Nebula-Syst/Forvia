name: Publish Docker images

# Images are published from a *published release*, never from a bare tag push.
# A tag that is later deleted (the versioning rule consolidates unreleased tags)
# would otherwise leave its image tags behind in GHCR forever, and dependency
# bots read those as a newer version. See issue #87.
on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - image: api
            context: ./api
            file: ./api/Dockerfile
          - image: web
            context: .
            file: ./web/Dockerfile
    steps:
      - uses: actions/checkout@v7

      - name: Lowercase owner (registry names must be lowercase)
        id: repo
        run: echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Set version metadata
        id: version_meta
        run: |
          # On a release the ref is refs/tags/vX.Y.Z; on a main push it is a branch ref,
          # which would otherwise label the image "refs/heads/main".
          case "$GITHUB_REF" in
            refs/tags/*) VERSION="${GITHUB_REF#refs/tags/}" ;;
            *)           VERSION="main-${GITHUB_SHA::7}" ;;
          esac
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "VCS_REF=${GITHUB_SHA}" >> $GITHUB_OUTPUT
          echo "BUILD_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> $GITHUB_OUTPUT

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ghcr.io/${{ steps.repo.outputs.owner }}/forvia-${{ matrix.image }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ steps.version_meta.outputs.VERSION }},enable=${{ github.event_name == 'release' }}

      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/amd64,linux/arm64
          build-args: |
            VERSION=${{ steps.version_meta.outputs.VERSION }}
            VCS_REF=${{ steps.version_meta.outputs.VCS_REF }}
            BUILD_DATE=${{ steps.version_meta.outputs.BUILD_DATE }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  # Runs only for a real release (never a plain push to main), and only after both images
  # (api, web) are already pushed to GHCR — so there's never a window where this pulls a tag
  # that isn't there yet. `runs-on: forvia-deploy` targets the self-hosted runner in
  # ~/Proyectos/forvia-deploy on the production host (see its docker-compose.yml for what it
  # can and can't do) — nothing here reaches the server over the network, the job just *is*
  # a process running on it.
  deploy:
    needs: build
    if: github.event_name == 'release'
    runs-on: [self-hosted, forvia-deploy]
    steps:
      - name: Ensure docker CLI is on the runner
        run: command -v docker || (apt-get update && apt-get install -y docker-ce-cli docker-compose-plugin)

      # The runner container's own docker CLI needs its own GHCR login to pull a private
      # image — a login on the host doesn't carry over, docker credentials live client-side.
      # Same token the build job already uses to push; it can read what it just pushed.
      - uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull ${{ github.ref_name }} and redeploy
        working-directory: /home/josemgl/Proyectos/forvia-prod
        run: |
          sed -i "s/^FORVIA_VERSION=.*/FORVIA_VERSION=${{ github.ref_name }}/" .env
          docker compose pull api web
          docker compose up -d
          sleep 3
          set -a; source .env; set +a
          curl -fsS "http://localhost:${WEB_PORT:-13027}/api/health"
